name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python3 tests/distribution.py
      - run: python3 tests/scheduling.py
      - run: python3 tests/substack_gateway.py
      - run: node --check companion/popup.js && node --check companion/editor.js
      - run: python3 -m py_compile scripts/install-companion.py
      - run: python3 tests/deployment.py
      - run: python3 tests/preview_http.py
      - run: cargo build --release --locked
      - run: python3 scripts/benchmark.py | tee benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine-benchmark
          path: benchmark.json
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: sudo apt-get update && sudo apt-get install -y cmake qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtquick-window xvfb libgl1-mesa-dri
      - run: cargo build --release --locked
      - run: cmake -S desktop -B build/desktop -DCMAKE_BUILD_TYPE=Release && cmake --build build/desktop --parallel 2
      - run: ctest --test-dir build/desktop --output-on-failure
      - name: Native application and clipboard smoke
        env:
          OMAPRESS_CLI: ${{ github.workspace }}/target/release/omapress
          QT_QUICK_BACKEND: software
        run: |
          xvfb-run -a build/desktop/omapress-desktop --publication "$PWD/fixtures/fixing-everything" --smoke
          xvfb-run -a build/desktop/omapress-desktop --clipboard-smoke
          xvfb-run -a build/desktop/omapress-desktop --dialogs-smoke
      - run: python3 scripts/package.py
      - name: Install bundle and verify both binaries
        run: |
          bundle=$(find dist -mindepth 1 -maxdepth 1 -type d -name 'omapress-*' -print -quit)
          sh "$bundle/install.sh" "$RUNNER_TEMP/omapress-installed"
          "$RUNNER_TEMP/omapress-installed/bin/omapress" --version
          test -f "$RUNNER_TEMP/omapress-installed/share/omapress/worker/omapress-worker.service"
          test -f "$RUNNER_TEMP/omapress-installed/share/doc/omapress/substack-gateway.md"
          python3 tests/installed_companion.py "$RUNNER_TEMP/omapress-installed"
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software "$RUNNER_TEMP/omapress-installed/bin/omapress-desktop" --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: omapress-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        run: pacman -Syu --noconfirm rust cmake qt6-base qt6-declarative qt6-wayland git github-cli curl libsecret xdg-utils python desktop-file-utils namcap
      - name: Build unsigned package as an ordinary user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'set -euo pipefail; cd "$1"; makepkg --noconfirm --cleanbuild; makepkg --printsrcinfo > actual.SRCINFO; diff -u .SRCINFO actual.SRCINFO' _ "$GITHUB_WORKSPACE/packaging/arch"
      - name: Inspect, install, launch, reinstall and remove
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          cd packaging/arch
          namcap PKGBUILD
          package=$(find . -maxdepth 1 -name 'omapress-*.pkg.tar.zst' ! -name '*debug*' -print -quit)
          test -n "$package"
          namcap "$package" | tee namcap-report.txt
          python -c 'from pathlib import Path; assert not any(" E: " in line for line in Path("namcap-report.txt").read_text().splitlines()), "namcap reported packaging errors"'
          sha256sum "$package" > SHA256SUMS
          bsdtar -tvf "$package" > package-files.txt
          # The minimal Arch image excludes documentation on installation.
          # Retain it here to validate the complete package payload.
          sed -i '/^NoExtract/d' /etc/pacman.conf
          pacman -U --noconfirm "$package"
          runuser -u builder -- env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software omapress-desktop --dialogs-smoke
          runuser -u builder -- python "$GITHUB_WORKSPACE/tests/installed_companion.py" /usr
          test -f /usr/share/omapress/worker/omapress-worker.timer
          test -f /usr/share/doc/omapress/substack-gateway.md
          grep -q '^ExecStart=/usr/bin/omapress worker ' /usr/share/omapress/worker/omapress-worker.service
          pacman -U --noconfirm "$package"
          pacman -R --noconfirm omapress
          test ! -e /usr/bin/omapress
          test ! -e /usr/bin/omapress-desktop
          test ! -e /usr/bin/omapress-companion
      - uses: actions/upload-artifact@v4
        with:
          name: omapress-arch-unsigned
          path: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/SHA256SUMS
            packaging/arch/package-files.txt
            packaging/arch/namcap-report.txt
