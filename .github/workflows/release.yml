name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (must match Cargo.toml, e.g. v0.1.0-rc.1)'
        required: true
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 -c 'import os,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]; assert os.environ["RELEASE_TAG"]=="v"+v'
      - run: sudo apt-get update && sudo apt-get install -y cmake qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtquick-window xvfb
      - run: cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --workspace --locked && cargo build --release --locked
      - run: OMAPRESS_CLI="$PWD/target/release/omapress" python3 tests/deployment.py && OMAPRESS_CLI="$PWD/target/release/omapress" python3 tests/preview_http.py
      - run: cmake -S desktop -B build/desktop -DCMAKE_BUILD_TYPE=Release && cmake --build build/desktop --parallel 2
      - run: QT_QUICK_BACKEND=software OMAPRESS_CLI="$PWD/target/release/omapress" xvfb-run -a build/desktop/omapress-desktop --smoke && QT_QUICK_BACKEND=software xvfb-run -a build/desktop/omapress-desktop --clipboard-smoke
      - run: python3 scripts/package.py
      - name: Publish versioned release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --title "OmaPress $RELEASE_TAG" --notes-file docs/release-notes.md dist/*.tar.gz dist/SHA256SUMS
