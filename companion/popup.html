<!doctype html><html lang="en"><meta charset="utf-8"><title>Pressroom</title><link rel="stylesheet" href="popup.css">
<body><h1>Pressroom</h1><p>Choose a reviewed article from your desktop outbox.</p>
<label for="articles">Prepared article</label><select id="articles"></select>
<p id="destination"></p><button id="fill" disabled>Fill this blank Substack draft</button>
<p>Review formatting, images, audience, and email delivery in Substack before publishing.</p>
<button id="confirm" disabled>Record this published page for the selected article</button>
<button id="remove" disabled>Remove selected article from outbox</button>
<p id="status" role="status" aria-live="polite">Loading outbox…</p><script type="module" src="popup.js"></script></body></html>
