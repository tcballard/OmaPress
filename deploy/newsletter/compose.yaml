services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: newsletter
      POSTGRES_USER: newsletter
      POSTGRES_PASSWORD: ${NEWSLETTER_DB_PASSWORD:?Set a database password in .env}
    volumes:
      - newsletter-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U newsletter -d newsletter"]
      interval: 5s
      timeout: 5s
      retries: 10
  newsletter:
    build:
      context: ../..
      dockerfile: deploy/newsletter/Dockerfile
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://newsletter:${NEWSLETTER_DB_PASSWORD}@database/newsletter
      NEWSLETTER_BIND: 0.0.0.0:8787
    ports:
      - "127.0.0.1:8787:8787"
    init: true
volumes:
  newsletter-data:
